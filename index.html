    * {

    body {

      font-size: 14px;

    /* ===== 主容器 ===== */

      letter-spacing: 1.5px;

      padding-bottom: 8px;
      margin-bottom: 12px;
      text-align: center;

    }

    /* ===== 左：监控面板 ===== */
    .monitor-panel {
      flex: 1 1 280px;
    }
    .monitor-avatar .avatar-box {
      width: 100%;
      aspect-ratio: 1/1;
      border: 2px solid #33ff66;
      background-color: #111811;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .monitor-avatar .avatar-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }
    .monitor-avatar .avatar-label {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.5;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .monitor-reaction {
      border: 1px solid #1a3a1a;
      background-color: #0a120a;
      padding: 10px 12px;
      min-height: 50px;
      font-size: 12px;
      line-height: 1.5;
      margin: 10px 0 10px 0;
      display: flex;
      align-items: center;
    }
    .monitor-reaction .prefix {
      color: #55aa55;
      margin-right: 5px;
    }
    .monitor-reaction #reactionText {
      color: #88ff88;
    }

    .monitor-mood .mood-label {

      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 2px;
    }
    .monitor-mood .mood-bar-bg {
      width: 100%;
      height: 14px;
      background-color: #0a120a;
      border: 1px solid #2a4a2a;
    }
    .monitor-mood .mood-bar-fill {
      height: 100%;
      width: 70%;
      background-color: #33ff66;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(51, 255, 102, 0.15);
    }
    .mood-bar-fill.low {
      background-color: #ff6644;
      box-shadow: 0 0 12px rgba(255, 102, 68, 0.25);
    }
    .mood-bar-fill.mid {
      background-color: #ffcc33;
      box-shadow: 0 0 12px rgba(255, 204, 51, 0.2);
    }

    .monitor-status {
      font-size: 10px;
      text-align: center;
      margin-top: 10px;
      opacity: 0.5;
      animation: blink 1.5s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.1; }
    }

    .monitor-music {
      text-align: right;
      border-top: 1px dashed #1a2a1a;
      padding-top: 12px;
      margin-top: 8px;
    }

      color: #33ff66;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 8px 20px;
      cursor: pointer;
      border: 3px solid #33ff66;
      box-shadow: inset 0 0 0 1px #1a3a1a, 0 0 0 1px #1a3a1a;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(51, 255, 102, 0.3);
      transition: all 0.1s ease;
      user-select: none;
    }
    .music-btn:hover {
      background: #1a2a1a;
      box-shadow: inset 0 0 0 1px #33ff66, 0 0 15px rgba(51, 255, 102, 0.3);
      text-shadow: 0 0 10px rgba(51, 255, 102, 0.6);
    }
    .music-btn:active {
      transform: scale(0.95);
      background: #0a1a0a;
      box-shadow: inset 0 0 10px rgba(51, 255, 102, 0.2), 0 0 5px rgba(51, 255, 102, 0.1);
    }

    .center-panel {
      flex: 1 1 280px;
      align-items: center;
      text-align: center;
    }

      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .center-panel .sub-head {
      font-size: 10px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

      aspect-ratio: 1/1;
      border: 2px solid #33ff66;
      background-color: #111811;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }

    .center-panel .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0 6px 0;
      width: 100%;
    }
    .center-panel .cloth-btn {
      background-color: #1a2a1a;
      color: #33ff66;
      border: 1px solid #33ff66;
      padding: 10px 20px;
      margin: 5px 10px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
      min-width: 60px;
      max-width: 120px;
    }
    .center-panel .cloth-btn:hover {
      background-color: #2a4a2a;
    }

    .center-panel #dialogue-box {
      width: 100%;
      border: 1px solid #1a3a1a;
      background-color: #0a120a;
      padding: 10px 12px;
      min-height: 44px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    /* ===== 右：评价区 ===== */
    .comment-panel {
      flex: 1 1 240px;
    }
    .comment-list {
      flex: 1;

      max-height: 360px;
      overflow-y: auto;

      background-color: #0a120a;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.8;
    }
    .comment-list::-webkit-scrollbar {
      width: 4px;
    }
    .comment-list::-webkit-scrollbar-track {
      background: #0a120a;
    }
    .comment-list::-webkit-scrollbar-thumb {
      background: #2a4a2a;
    }

    .comment-item {
      border-bottom: 1px dashed #1a2a1a;
      padding: 4px 0;
      opacity: 0.9;
    }
    .comment-item .name {
      color: #55aa55;
      margin-right: 6px;
    }
    .comment-item .time {

      opacity: 0.4;
      float: right;
    }

    .comment-input-group {
      display: flex;
      gap: 8px;
    }
    .comment-input-group input {
      flex: 1;
      background: #0a120a;
      border: 1px solid #2a4a2a;
      color: #33ff66;
      padding: 6px 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      outline: none;
    }
    .comment-input-group input:focus {
      border-color: #33ff66;
    }
    .comment-input-group input::placeholder {
      color: #2a4a2a;
      opacity: 0.6;
    }

      background: none;
      border: 1px solid #33ff66;
      color: #33ff66;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 4px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .comment-input-group button:hover {
      background-color: #1a2a1a;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 960px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
      .panel {
        max-width: 420px;
        width: 100%;
      }
      .comment-list {
        max-height: 150px;
        min-height: 100px;
      }
    }
    /* ===== 头像呼吸 + 扫描线效果 ===== */
#monitorImg {
  animation: breathe 3s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% {
    opacity: 1;
    filter: brightness(1) drop-shadow(0 0 5px rgba(51, 255, 102, 0.15));
  }
  50% {
    opacity: 0.75;
    filter: brightness(1.4) drop-shadow(0 0 25px rgba(51, 255, 102, 0.5));
  }
}

/* 可选：在头像上方叠加一层扫描线动画 */
.monitor-avatar {
  position: relative;
  overflow: hidden;
}

.monitor-avatar::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(51, 255, 102, 0.03) 2px,
    rgba(51, 255, 102, 0.03) 4px
  );
  pointer-events: none;
  animation: scan 4s linear infinite;
}

@keyframes scan {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}
/* ===== 像素闪烁 ===== */
#gameImg {
  animation: flicker 3s steps(2) infinite;
}

@keyframes flicker {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.85;
  }
  51% {
    opacity: 1;
  }
  52% {
    opacity: 0.9;
  }
}
/* ===== 扫描线 ===== */
#character-box {
  position: relative;
  overflow: hidden;
}

#character-box::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0, 0, 0, 0.1) 3px,
    rgba(0, 0, 0, 0.1) 4px
  );
  pointer-events: none;
  z-index: 2;
  animation: scanlines 8s linear infinite;
}

@keyframes scanlines {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}
/* ===== 全息干扰 ===== */
#gameImg {
  animation: glitch 4s ease-in-out infinite;
}

@keyframes glitch {
  0%, 100% {
    filter: brightness(1);
    transform: skewX(0deg);
  }
  2% {
    filter: brightness(1.5);
    transform: skewX(-2deg);
  }
  4% {
    filter: brightness(1);
    transform: skewX(0deg);
  }
  6% {
    filter: brightness(1.3);
    transform: skewX(2deg);
  }
  8%, 100% {
    filter: brightness(1);
    transform: skewX(0deg);
  }
}
/* ===== 动态心电图容器 ===== */
.ecg-wrapper {
  margin-top: 10px;

  background: #0a120a;
  padding: 0;
  position: relative;
  overflow: hidden;
  height: 56px;

}

.ecg-wrapper canvas {
  width: 100%;
  height: 100%;

}

/* 心电图标签 */
.ecg-label {
  position: absolute;

}
/* ===== 心电图声音开关 ===== */
.ecg-sound-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #0f140f;
  color: #33ff66;
  border: 1px solid #1a3a1a;
  padding: 2px 10px 2px 8px;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  cursor: pointer;
  user-select: none;

}

.ecg-sound-toggle:hover {
  border-color: #33ff66;
  background: #1a2a1a;
}

.ecg-sound-toggle .indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 0;

}

.ecg-sound-toggle .indicator.on {
  background: #33ff66;
  box-shadow: 0 0 8px rgba(51, 255, 102, 0.4);
}

.ecg-sound-toggle .indicator.off {
  background: #2a4a2a;
  box-shadow: none;
}

    var hue = 120 + Math.random() * 30;

    var dot = document.createElement('div');
    dot.style.cssText = `
        position: absolute;
        left: ${x - size/2}px;
        top: ${y - size/2}px;
        width: ${size}px;
        height: ${size}px;
        border: 3px solid ${color};
        border-radius: 0;
        box-shadow: 0 0 8px ${color}, inset 0 0 4px ${color};
        opacity: 1;
        transform: scale(0.3);
        image-rendering: pixelated;
        animation: pixelRingFade 0.7s ease-out forwards;
    `;
    
    trailContainer.appendChild(dot);
    
    // 0.8秒后移除元素
    setTimeout(function() {
        if (dot.parentNode) {
            dot.parentNode.removeChild(dot);
        }
    }, 800);
}

function playDingSound() {
    try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 创建一个短促的高频音调（类似“叮”）
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.value = 1200; // 高音，类似“叮”
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
    } catch(e) {
        // 静默失败
    }
}

function checkKeywordReply(inputText) {
    var lowerInput = inputText.toLowerCase();
    
    for (var i = 0; i < keywordReplies.length; i++) {
        var rule = keywordReplies[i];
        for (var j = 0; j < rule.keywords.length; j++) {
            var keyword = rule.keywords[j];
            if (lowerInput.includes(keyword.toLowerCase())) {
                // 匹配成功，计算延迟时间（0.5~1.5秒随机）
                var delay = 500 + Math.random() * 1000; // 500ms ~ 1500ms
                
                // 把回复内容存下来，供延迟执行使用
                var replyText = rule.reply;
                if (replyText.includes('心情值')) {
                    var moodDisplay = document.getElementById('moodDisplay');
                    replyText = replyText.replace('心情值', moodDisplay.textContent);
                }
                var authorName = rule.author;
                
                // 延迟执行回复
                setTimeout(function() {
                    // 先播放“叮”的声音
                    playDingSound();
                    
                    // 再插入回复
                    var list = document.getElementById('commentList');
                    var newItem = document.createElement('div');
                    newItem.className = 'comment-item';
                    newItem.innerHTML = '<span class="name" style="color:#ffcc33;">' + authorName + '</span><span>' + replyText + '</span><span class="time">刚刚</span>';
                    list.insertBefore(newItem, list.firstChild);
                    
                    while (list.children.length > 20) {
                        list.removeChild(list.lastChild);
                    }
                }, delay);
                
                // 只触发第一条匹配的规则
                return true;
            }
        }
    }
    return false;
}

// ============================================================
// 💚 动态心电图 + 心跳音效（带开关）
// ============================================================

function createDynamicECG() {
    // 1. 创建容器
    var monitorPanel = document.querySelector('.monitor-panel');
    var moodSection = monitorPanel.querySelector('.monitor-mood');
    
    if (document.getElementById('ecg-wrapper')) return;
    
    var wrapper = document.createElement('div');
    wrapper.id = 'ecg-wrapper';
    wrapper.className = 'ecg-wrapper';
    wrapper.style.cssText = `
        margin-top: 10px;
        width: 100%;
        border: 1px solid #1a3a1a;
        background: #0a120a;
        padding: 0;
        position: relative;
        overflow: hidden;
        height: 56px;
        box-sizing: border-box;
    `;
    
    var canvas = document.createElement('canvas');
    canvas.id = 'ecg-canvas';
    canvas.width = 320;
    canvas.height = 56;
    canvas.style.cssText = `
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
    `;
    
    var label = document.createElement('div');
    label.className = 'ecg-label';
    label.textContent = '❤ ECG';
    label.style.cssText = `
        position: absolute;
        bottom: 2px;
        right: 6px;
        font-size: 8px;
        color: #2a4a3a;
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
        z-index: 2;
        opacity: 0.6;
    `;
    
    wrapper.appendChild(canvas);
    wrapper.appendChild(label);
    moodSection.parentNode.insertBefore(wrapper, moodSection.nextSibling);
    
    // ============================================================
    // 🔊 声音开关
    // ============================================================
    var soundEnabled = true;
    
    var toggleBtn = document.createElement('div');
    toggleBtn.className = 'ecg-sound-toggle';
    toggleBtn.innerHTML = `
        <span class="indicator on" id="ecg-sound-indicator"></span>
        <span>心音（默认开启）</span>
    `;
    toggleBtn.style.cssText = `
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #0f140f;
        color: #33ff66;
        border: 1px solid #1a3a1a;
        padding: 2px 10px 2px 8px;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        cursor: pointer;
        user-select: none;
        transition: all 0.2s ease;
        margin-top: 4px;
        letter-spacing: 0.5px;
    `;
    
    toggleBtn.onmouseover = function() {
        this.style.borderColor = '#33ff66';
        this.style.background = '#1a2a1a';
    };
    toggleBtn.onmouseout = function() {
        this.style.borderColor = '#1a3a1a';
        this.style.background = '#0f140f';
    };
    
    toggleBtn.onclick = function() {
        soundEnabled = !soundEnabled;
        var indicator = this.querySelector('.indicator');
        if (soundEnabled) {
            indicator.className = 'indicator on';
            indicator.style.background = '#33ff66';
            indicator.style.boxShadow = '0 0 8px rgba(51, 255, 102, 0.4)';
            playHeartbeatSound();
        } else {
            indicator.className = 'indicator off';
            indicator.style.background = '#2a4a2a';
            indicator.style.boxShadow = 'none';
        }
    };
    
    wrapper.parentNode.insertBefore(toggleBtn, wrapper.nextSibling);
    
    // ============================================================
    // 绘图初始化
    // ============================================================
    var ctx = canvas.getContext('2d');
    var W = canvas.width;
    var H = canvas.height;
    var centerY = H / 2;
    
    var bufferSize = W;
    var ecgBuffer = new Array(bufferSize).fill(centerY);
    var writeIndex = 0;
    
    // ============================================================
    // 🔊 心跳音效
    // ============================================================
    var audioCtx = null;
    
    function initAudioContext() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }
    
    function playHeartbeatSound() {
        try {
            var ctx = initAudioContext();
            if (!ctx) return;
            var now = ctx.currentTime;
            
            var osc1 = ctx.createOscillator();
            var gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.value = 900 + Math.random() * 100;
            gain1.gain.setValueAtTime(0.25, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.06);
            
            var osc2 = ctx.createOscillator();
            var gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.value = 700 + Math.random() * 80;
            gain2.gain.setValueAtTime(0.15, now + 0.06);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.06);
            osc2.stop(now + 0.12);
        } catch(e) {}
    }
    
    var lastBeatSoundTime = 0;
    var beatSoundCooldown = 150;
    
    function triggerHeartbeatSound() {
        if (!soundEnabled) return;  // 👈 开关控制
        var now = Date.now();
        if (now - lastBeatSoundTime < beatSoundCooldown) return;
        lastBeatSoundTime = now;
        playHeartbeatSound();
    }
    
    // ============================================================
    // 心情值 & 颜色
    // ============================================================
    function getMood() {
        var display = document.getElementById('moodDisplay');
        if (!display) return 70;
        var num = parseInt(display.textContent);
        return isNaN(num) ? 70 : Math.min(100, Math.max(0, num));
    }
    
    function getECGColor() {
        var mood = getMood();
        if (mood < 30) return '#ff5544';
        if (mood < 60) return '#ffcc33';
        return '#33ff66';
    }
    
    function getBeatInterval() {
        var mood = getMood();
        var minInterval = 280;
        var maxInterval = 1200;
        return maxInterval - (mood / 100) * (maxInterval - minInterval);
    }
    
    // ============================================================
    // 波形生成
    // ============================================================
    var beatPhase = 0;
    var lastBeatDetected = false;
    
    function generateECGPoint() {
        var mood = getMood();
        var amp = 16 + (mood / 100) * 10;
        var base = centerY + (Math.random() - 0.5) * 1.5;
        var interval = getBeatInterval();
        var speed = 1000 / interval;
        beatPhase += 0.02 * speed * 1.5;
        if (beatPhase > Math.PI * 2) beatPhase -= Math.PI * 2;
        var heartbeat = 0;
        var phase = beatPhase % (Math.PI * 2);
        var isBeat = false;
        if (phase < 0.15) {
            var t = phase / 0.15;
            heartbeat = -amp * Math.sin(t * Math.PI) * 0.9;
            if (t > 0.5 && !lastBeatDetected) {
                isBeat = true;
                lastBeatDetected = true;
            }
        } else if (phase < 0.35) {
            var t = (phase - 0.15) / 0.2;
            heartbeat = amp * 0.15 * (1 - t);
        } else if (phase < 0.5) {
            var t = (phase - 0.35) / 0.15;
            heartbeat = -amp * 0.3 * Math.sin(t * Math.PI);
        } else {
            heartbeat = 0;
            if (phase > 0.6) lastBeatDetected = false;
        }
        if (isBeat) triggerHeartbeatSound();
        var noise = (Math.random() - 0.5) * 0.5;
        return base + heartbeat + noise;
    }
    
    // ============================================================
    // 绘制循环
    // ============================================================
    function drawECG() {
        var newPoint = generateECGPoint();
        ecgBuffer[writeIndex] = newPoint;
        writeIndex = (writeIndex + 1) % bufferSize;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0a120a';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = '#152015';
        ctx.lineWidth = 0.5;
        for (var gx = 0; gx < W; gx += 20) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, H);
            ctx.stroke();
        }
        for (var gy = 0; gy < H; gy += 10) {
            ctx.beginPath();
            ctx.moveTo(0, gy);
            ctx.lineTo(W, gy);
            ctx.stroke();
        }
        var color = getECGColor();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        var start = writeIndex;
        for (var i = 0; i < bufferSize; i++) {
            var idx = (start + i) % bufferSize;
            var x = (i / bufferSize) * W;
            var y = ecgBuffer[idx];
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
        var minVal = Infinity;
        var minIdx = 0;
        for (var p = 0; p < bufferSize; p++) {
            if (ecgBuffer[p] < minVal) {
                minVal = ecgBuffer[p];
                minIdx = p;
            }
        }
        var px = ((minIdx - start + bufferSize) % bufferSize) / bufferSize * W;
        var py = minVal;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillRect(px - 2, py - 2, 4, 4);
        ctx.shadowBlur = 0;
        var mood = getMood();
        var bpm = Math.round(60 / (getBeatInterval() / 1000));
        ctx.fillStyle = '#2a4a3a';
        ctx.font = '8px "Courier New", monospace';
        ctx.fillText(bpm + ' bpm', W - 55, H - 4);
        var barWidth = 40;
        var barHeight = 4;
        var fillWidth = (mood / 100) * barWidth;
        ctx.fillStyle = '#1a2a1a';
        ctx.fillRect(4, H - 6, barWidth, barHeight);
        ctx.fillStyle = color;
        ctx.fillRect(4, H - 6, fillWidth, barHeight);
        requestAnimationFrame(drawECG);
    }
    
    setTimeout(drawECG, 100);
    console.log('💚 动态心电图 + 心跳音效（带开关）已启动！');
}

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(createDynamicECG, 500);
});

function initAvatarEffects() {
    var avatarImg = document.getElementById('monitorImg');
    if (!avatarImg) return;
    
    var isAnimating = false;
    
    // ---- 感叹号词库（完全保留） ----
    var exclamations = ['❗', '❕', '！', '❓', '‼️', '⁉️', '⚠️', '💥'];
    var textExclamations = ['WhAt!', '😡', '？？', 'Click!', 'STOP!', '💢'];
    
    // ---- 创建感叹号（完全保留原逻辑） ----
    function createExclamation() {
        var pool = Math.random() > 0.5 ? exclamations : textExclamations;
        var content = pool[Math.floor(Math.random() * pool.length)];
        
        var el = document.createElement('div');
        el.textContent = content;
        el.style.cssText = `
            position: fixed;
            font-size: ${32 + Math.random() * 24}px;
            font-family: 'Courier New', monospace;
            color: #ffcc33;
            text-shadow: 0 0 30px rgba(255, 204, 51, 0.6);
            pointer-events: none;
            z-index: 99999;
            user-select: none;
            font-weight: bold;
            image-rendering: pixelated;
            animation: exclamationPop 1s ease-out forwards;
        `;
        
        var rect = avatarImg.getBoundingClientRect();
        var x = rect.left + rect.width / 2 - 20 + (Math.random() - 0.5) * 30;
        var y = rect.top - 30 + (Math.random() - 0.5) * 20;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        
        document.body.appendChild(el);
        
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 1200);
    }
    
    // ---- 弹跳动画（完全保留原参数） ----
    function doBounce() {
        var steps = 10;        // 完全保留
        var step = 0;
        
        function bounceStep() {
            var progress = step / steps;
            var scale = 1 - 0.25 * Math.sin(progress * Math.PI * 2) * Math.exp(-progress * 2);
            var rotate = 2 * Math.sin(progress * Math.PI * 3) * Math.exp(-progress * 2.5);
            
            avatarImg.style.transform = 'scale(' + scale + ') rotate(' + rotate + 'deg)';
            step++;
            
            if (step < steps) {
                setTimeout(bounceStep, 50);  // 完全保留
            } else {
                avatarImg.style.transform = 'scale(1) rotate(0deg)';
                isAnimating = false;
            }
        }
        bounceStep();
    }
    
    // ---- 主触发函数 ----
    function triggerEffects() {
        if (isAnimating) return;
        isAnimating = true;
        
        createExclamation();
        doBounce();
    }
    
    // ---- 添加CSS动画（去重） ----
    if (!document.getElementById('exclamation-style')) {
        var styleSheet = document.createElement('style');
        styleSheet.id = 'exclamation-style';
        styleSheet.textContent = `
            @keyframes exclamationPop {
                0% {
                    opacity: 0;
                    transform: scale(0.3) translateY(10px) rotate(-10deg);
                }
                30% {
                    opacity: 1;
                    transform: scale(1.3) translateY(-10px) rotate(3deg);
                }
                60% {
                    transform: scale(0.9) translateY(0px) rotate(-2deg);
                }
                100% {
                    opacity: 0;
                    transform: scale(1) translateY(-30px) rotate(0deg);
                }
            }
        `;
        document.head.appendChild(styleSheet);
    }
    
    // 👇 唯一改动：双击 → 单击
    avatarImg.addEventListener('click', function(e) {
        e.stopPropagation();
        triggerEffects();
    });
    
    console.log('👤 单击弹跳+感叹号效果已启动（频率不变）！');
}

    font-size: 10px;
    color: #2a4a2a;
    margin-top: 14px;
    letter-spacing: 1px;
`;
modal.appendChild(footerNote);

overlay.appendChild(modal);
document.body.appendChild(overlay);

// ===== 6. 控制函数（带渐入渐出） =====
function openModal() {
    overlay.style.display = 'flex';
    
    requestAnimationFrame(function() {
        overlay.style.background = 'rgba(0, 0, 0, 0.8)';
        overlay.style.backdropFilter = 'blur(4px)';
        modal.style.opacity = '1';
        modal.style.transform = 'scale(1) translateY(0)';
    });
    
    overlay.onclick = function(e) {
        if (e.target === overlay) {
            closeModal();
        }
    };
}

function closeModal() {
    overlay.style.background = 'rgba(0, 0, 0, 0)';
    overlay.style.backdropFilter = 'blur(0px)';
    modal.style.opacity = '0';
    modal.style.transform = 'scale(0.85) translateY(20px)';
    
    setTimeout(function() {
        overlay.style.display = 'none';
    }, 400);
}

// 点击左上角按钮打开弹窗
logBtn.onclick = openModal;

// ESC 键关闭弹窗
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.style.display === 'flex') {
        closeModal();
    }
});

</script>

</body>
