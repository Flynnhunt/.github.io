<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>❤️ 心动调试终端 - 换装协议 ❤️</title>
  
  <!-- 保留你原来的字体链接 -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    /* ===== 全局重置 & 字体 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'MyPixelFont';
      src: url('ark-pixel.ttf') format('truetype');
    }

    body {
      background-color: #0a0f0a;
      color: #33ff66;
      font-family: 'MyPixelFont', 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-size: 14px;
    }

    /* ===== 主容器 ===== */
    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ===== 通用卡片样式 ===== */
    .panel {
      border: 2px solid #33ff66;
      background-color: #0f140f;
      padding: 18px 18px 20px 18px;
      box-shadow: 0 0 25px rgba(51, 255, 102, 0.07);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 220px;
      max-width: 380px;
    }

    .panel-title {
      font-size: 13px;
      letter-spacing: 1.5px;
      border-bottom: 1px dashed #2a4a2a;
      padding-bottom: 8px;
      margin-bottom: 12px;
      text-align: center;
      opacity: 0.8;
    }

    /* ===== 左：监控面板 ===== */
    .monitor-panel {
      flex: 1 1 280px;
    }
    .monitor-avatar .avatar-box {
      width: 100%;
      aspect-ratio: 1/1;
      border: 2px solid #33ff66;
      background-color: #111811;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .monitor-avatar .avatar-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }
    .monitor-avatar .avatar-label {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.5;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .monitor-reaction {
      border: 1px solid #1a3a1a;
      background-color: #0a120a;
      padding: 10px 12px;
      min-height: 50px;
      font-size: 12px;
      line-height: 1.5;
      margin: 10px 0 10px 0;
      display: flex;
      align-items: center;
    }
    .monitor-reaction .prefix {
      color: #55aa55;
      margin-right: 5px;
    }
    .monitor-reaction #reactionText {
      color: #88ff88;
    }

    .monitor-mood .mood-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 2px;
    }
    .monitor-mood .mood-bar-bg {
      width: 100%;
      height: 14px;
      background-color: #0a120a;
      border: 1px solid #2a4a2a;
    }
    .monitor-mood .mood-bar-fill {
      height: 100%;
      width: 70%;
      background-color: #33ff66;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(51, 255, 102, 0.15);
    }
    .mood-bar-fill.low {
      background-color: #ff6644;
      box-shadow: 0 0 12px rgba(255, 102, 68, 0.25);
    }
    .mood-bar-fill.mid {
      background-color: #ffcc33;
      box-shadow: 0 0 12px rgba(255, 204, 51, 0.2);
    }

    .monitor-status {
      font-size: 10px;
      text-align: center;
      margin-top: 10px;
      opacity: 0.5;
      animation: blink 1.5s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.1; }
    }

    .monitor-music {
      text-align: right;
      border-top: 1px dashed #1a2a1a;
      padding-top: 12px;
      margin-top: 8px;
    }
    /* 音乐按钮样式 - 保留你原来的自绘风格 */
    .music-btn {
      display: inline-block;
      background: #0f140f;
      color: #33ff66;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 8px 20px;
      cursor: pointer;
      border: 3px solid #33ff66;
      box-shadow: inset 0 0 0 1px #1a3a1a, 0 0 0 1px #1a3a1a;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(51, 255, 102, 0.3);
      transition: all 0.1s ease;
      user-select: none;
    }
    .music-btn:hover {
      background: #1a2a1a;
      box-shadow: inset 0 0 0 1px #33ff66, 0 0 15px rgba(51, 255, 102, 0.3);
      text-shadow: 0 0 10px rgba(51, 255, 102, 0.6);
    }
    .music-btn:active {
      transform: scale(0.95);
      background: #0a1a0a;
      box-shadow: inset 0 0 10px rgba(51, 255, 102, 0.2), 0 0 5px rgba(51, 255, 102, 0.1);
    }

    /* ===== 中：角色展示 ===== */
    .center-panel {
      flex: 1 1 280px;
      align-items: center;
      text-align: center;
    }
    .center-panel h1 {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .center-panel .sub-head {
      font-size: 10px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .center-panel #character-box {
      width: 100%;
      aspect-ratio: 1/1;
      border: 2px solid #33ff66;
      background-color: #111811;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .center-panel #character-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }

    .center-panel .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0 6px 0;
      width: 100%;
    }
    .center-panel .cloth-btn {
      background-color: #1a2a1a;
      color: #33ff66;
      border: 1px solid #33ff66;
      padding: 10px 20px;
      margin: 5px 10px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
      min-width: 60px;
      max-width: 120px;
    }
    .center-panel .cloth-btn:hover {
      background-color: #2a4a2a;
    }

    .center-panel #dialogue-box {
      width: 100%;
      border: 1px solid #1a3a1a;
      background-color: #0a120a;
      padding: 10px 12px;
      min-height: 44px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    /* ===== 右：评价区 ===== */
    .comment-panel {
      flex: 1 1 240px;
    }
    .comment-list {
      flex: 1;
      min-height: 200px;
      max-height: 360px;
      overflow-y: auto;
      border: 1px solid #1a3a1a;
      background-color: #0a120a;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.8;
    }
    .comment-list::-webkit-scrollbar {
      width: 4px;
    }
    .comment-list::-webkit-scrollbar-track {
      background: #0a120a;
    }
    .comment-list::-webkit-scrollbar-thumb {
      background: #2a4a2a;
    }

    .comment-item {
      border-bottom: 1px dashed #1a2a1a;
      padding: 4px 0;
      opacity: 0.9;
    }
    .comment-item .name {
      color: #55aa55;
      margin-right: 6px;
    }
    .comment-item .time {
      font-size: 9px;
      opacity: 0.4;
      float: right;
    }

    .comment-input-group {
      display: flex;
      gap: 8px;
    }
    .comment-input-group input {
      flex: 1;
      background: #0a120a;
      border: 1px solid #2a4a2a;
      color: #33ff66;
      padding: 6px 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      outline: none;
    }
    .comment-input-group input:focus {
      border-color: #33ff66;
    }
    .comment-input-group input::placeholder {
      color: #2a4a2a;
      opacity: 0.6;
    }
    .comment-input-group button {
      background: none;
      border: 1px solid #33ff66;
      color: #33ff66;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 4px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .comment-input-group button:hover {
      background-color: #1a2a1a;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 960px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
      .panel {
        max-width: 420px;
        width: 100%;
      }
      .comment-list {
        max-height: 150px;
        min-height: 100px;
      }
    }
  </style>
</head>
<body>

<div class="main-container">

  <!-- ===== 左侧：监控面板 ===== -->
  <div class="panel monitor-panel">
    <div class="panel-title">⬡ 监控系统 v2.0</div>

    <div class="monitor-avatar">
      <div class="avatar-box">
        <!-- 监控头像固定不变，始终显示 head.jpg -->
        <img id="monitorImg" src="images/head.jpg" alt="角色">
      </div>
      <div class="avatar-label">[ 对象 #Ulrich · 已连接 ]</div>
    </div>

    <div class="monitor-reaction">
      <span class="prefix">⏺</span>
      <span id="reactionText">等待着装指令...</span>
    </div>

    <div class="monitor-mood">
      <div class="mood-label">
        <span>❤ 心情值</span>
        <span id="moodDisplay">70%</span>
      </div>
      <div class="mood-bar-bg">
        <div class="mood-bar-fill" id="moodFill" style="width:70%;"></div>
      </div>
    </div>

    <div class="monitor-status">● 信号稳定 · 帧率 60fps</div>

    <div class="monitor-music">
      <div class="music-btn" role="button" tabindex="0" onclick="toggleMusic()">▶ 播放音乐</div>
    </div>
  </div>

  <!-- ===== 中间：角色展示 ===== -->
  <div class="panel center-panel">
    <h1>✦ 换装情感协议 v1.0 ✦</h1>
    <div class="sub-head">--- 选择着装以更新对象状态 ---</div>

    <div id="character-box">
      <img id="gameImg" src="images/u1.png" alt="我的角色">
    </div>

    <div class="btn-group" id="btnGroup">
      <button class="cloth-btn" onclick="changeOutfit('images/u1.png', '日常服协议加载完成。状态：待机中。', 75)">日常便服</button>
      <button class="cloth-btn" onclick="changeOutfit('images/u2.png', '最初的形态，我找不到讨厌这套义体的理由。审美评级：A+', 100)">旧版义体</button>
      <button class="cloth-btn" onclick="changeOutfit('images/u3.png', '美中不足是带不了咖啡机...哦，毕竟这副义体有恒温系统，所以穿多并不会感受到多少热量。', 60)">出差套装</button>
      <button class="cloth-btn" onclick="changeOutfit('images/u4.png', '量身定制，做工精细。叩响天宇一角？我喜欢', 92)">二一又一</button>
      <button class="cloth-btn" onclick="changeOutfit('images/u5.png', '洞悉更新协议启动。状态：探索中。', 80)">洞悉更新</button>
      <button class="cloth-btn" onclick="changeOutfit('images/u6.png', '这套衣服的设计理念是“简约而不简单”，棉麻连帽衫，oversize。义体接触的反馈是：没有人能拒绝，包括阿德勒。', 85)">简约风</button>
    </div>

    <div id="dialogue-box">
      <span id="dialogueText">请选择一件衣服来启动对话协议。</span>
    </div>
  </div>

  <!-- ===== 右侧：评价区 ===== -->
  <div class="panel comment-panel">
    <div class="panel-title">💬 他人评价</div>

    <div class="comment-list" id="commentList">
      <div class="comment-item">
        <span class="name">预算破坏者</span>
        <span>乌尔里希你有空更新你的穿搭状态不如先还我非对称核素R!</span>
        <span class="time">刚刚</span>
      </div>
      <div class="comment-item">
        <span class="name">持续求购电池</span>
        <span>根据你的心情值变化，我认为这套确实非常适合你</span>
        <span class="time">1分钟前</span>
      </div>
      <div class="comment-item">
        <span class="name">噢，船长！</span>
        <span>一个好组员从来不会缺席组长的帖子！我这叫善解人意不叫摸鱼</span>
        <span class="time">3分钟前</span>
      </div>
    </div>

    <div class="comment-input-group">
      <input type="text" id="commentInput" placeholder="写下你的评价..." maxlength="50">
      <button onclick="addComment()">发送</button>
    </div>
  </div>

</div>

<!-- ===== 音频元素 ===== -->
<audio id="bg-music" loop>
  <source src="Last-and-First-Principles.mp3" type="audio/mpeg">
</audio>

<script>
  // ============================================================
  // 彩蛋收集系统配置（只改逻辑，不改任何文案和路径）
  // ============================================================

  // 所有「桌面清理大师」的词条（完全保留你的原词条）
  var EGG_COMMENTS = [
    '意识唤醒者教人类穿搭？',
    '这套不错',
    '穿成这样我觉得除了咖啡机没人理你了',
    '别告诉我你把实验经费都用在这里了',
    '我觉得你应该换一套更适合的衣服',
    '你确定这是实验室吗？',
    '？我怎么没见过你穿这套？',
    '玻璃花瓶？',
    '花里胡哨。'
  ];

  // 记录已经触发过的词条（用 Set 自动去重）
  var triggeredEggs = new Set();

  // 隐藏按钮是否已解锁
  var isHiddenUnlocked = false;

  // ============================================================
  // 核心换装函数（含彩蛋收集系统）
  // ============================================================
  function changeOutfit(imagePath, reaction, moodValue) {
    // 更新中间角色
    var gameImg = document.getElementById('gameImg');
    gameImg.style.opacity = '0.3';
    setTimeout(function() {
      gameImg.src = imagePath;
      gameImg.style.opacity = '1';
    }, 150);

    // 更新监控反应文本
    document.getElementById('reactionText').textContent = reaction;
    document.getElementById('dialogueText').textContent = reaction;

    // 更新心情值
    var fill = document.getElementById('moodFill');
    var display = document.getElementById('moodDisplay');
    fill.style.width = moodValue + '%';
    display.textContent = moodValue + '%';
    fill.classList.remove('low', 'mid');
    if (moodValue < 40) {
      fill.classList.add('low');
    } else if (moodValue < 70) {
      fill.classList.add('mid');
    }

    // ===== 评价生成（含彩蛋收集） =====
    var normalComments = [
      '我一直相信乌尔里希组长的审美...',
      '这地方会出现恋物癖恋机癖的话我一点都不会意外的',
      '组长也要当萌妹吗？',
      '如果可以拜托拯救一下负责人的审美吧....我不想再看到这个颓废大叔的homeless风了...',
      '会不会有点太吸引人了？',
      '组长的审美真是让人捉摸不透啊',
      '对！就是这样狠狠炫耀我们拉普拉斯的做工！',
      '您在穿搭方面花费的时间大抵是全拉普拉斯科算中心最长的。祝贺您，乌尔里希小组长。',
      '我总感觉负责人开小号来匿名留言了。是我的错觉吗',
      '我每天就是要看这些才有继续工作的动力啊...',
      '乌尔里希组长潮潮出水',
      '您终于决定抛弃您的穿衣理念了。',
      '本体是磁流体但是对自己的穿衣审美很有见解吗...',
      '好色情。',
      '对组长犯错了...',
      '喂前面的不觉得这些发言是在对磁流体进行骚扰吗？',
      '产生了多余的情感',
      '不好我的性取向！',
      '对着一个磁流体炫压抑？',
      '统一回复下对我们恋物癖的控诉：拜托这里可是拉普拉斯欸？',
      '到底怎么样才能加入乌尔里希组长的onlyfans...好焦虑',
      '做工好精良！图纸是自己画的吗？',
      '震惊！整天让我们把休假拿来加班的组长竟然私下是这样的磁...'
    ];

    var isEasterEgg = Math.random() < 0.2;  // 20% 概率触发彩蛋

    var randomComment;
    var commentAuthor;

    if (isEasterEgg) {
      // 从彩蛋池里选一条还没触发过的
      var availableEggs = EGG_COMMENTS.filter(function(egg) {
        return !triggeredEggs.has(egg);
      });

      // 如果所有彩蛋都已经触发过了，就随机选一条已触发的（避免没有可选）
      if (availableEggs.length === 0) {
        availableEggs = EGG_COMMENTS;
      }

      randomComment = availableEggs[Math.floor(Math.random() * availableEggs.length)];
      commentAuthor = '桌面清理大师';

      // 记录这次触发的词条
      triggeredEggs.add(randomComment);

      // 检查是否集齐所有彩蛋词条
      if (triggeredEggs.size === EGG_COMMENTS.length && !isHiddenUnlocked) {
        unlockHiddenButton();
      }
    } else {
      randomComment = normalComments[Math.floor(Math.random() * normalComments.length)];
      commentAuthor = '匿名';
    }

    var list = document.getElementById('commentList');
    var newItem = document.createElement('div');
    newItem.className = 'comment-item';

    if (isEasterEgg) {
      newItem.innerHTML = '<span class="name" style="color:#ffcc33;">' + commentAuthor + '</span><span>' + randomComment + '</span><span class="time">刚刚</span>';
    } else {
      newItem.innerHTML = '<span class="name">' + commentAuthor + '</span><span>' + randomComment + '</span><span class="time">刚刚</span>';
    }

    list.insertBefore(newItem, list.firstChild);

    while (list.children.length > 20) {
      list.removeChild(list.lastChild);
    }
  }

  // ============================================================
  // 解锁隐藏按钮
  // ============================================================
  function unlockHiddenButton() {
    isHiddenUnlocked = true;

    var btnGroup = document.getElementById('btnGroup');

    var hiddenBtn = document.createElement('button');
    hiddenBtn.className = 'cloth-btn';
    hiddenBtn.style.borderColor = '#ffcc33';
    hiddenBtn.style.color = '#ffcc33';
    hiddenBtn.style.boxShadow = '0 0 20px rgba(255, 204, 51, 0.3)';
    hiddenBtn.textContent = 'Only Fans';
    hiddenBtn.onclick = function() {
      changeOutfit('images/hidden.png', '？？！！谁把这张上传了...？！而且这是什么时候拍的！！！', 100);
      hiddenBtn.style.opacity = '0.6';
      hiddenBtn.style.cursor = 'default';
      hiddenBtn.onclick = null;

      var list = document.getElementById('commentList');
      var newItem = document.createElement('div');
      newItem.className = 'comment-item';
      newItem.innerHTML = '<span class="name" style="color:#ffcc33;">🎉 系统公告</span><span>此为私密贴！您只有一次观看机会！</span><span class="time">刚刚</span>';
      list.insertBefore(newItem, list.firstChild);
    };

    btnGroup.appendChild(hiddenBtn);

    document.getElementById('reactionText').textContent = '⚠ 检测到隐藏协议！点击金色按钮解锁！';
    document.getElementById('dialogueText').textContent = '⚠ 检测到隐藏协议！点击金色按钮解锁！';
  }

  // ===== 用户手动添加评价 =====
  function addComment() {
    var input = document.getElementById('commentInput');
    var text = input.value.trim();
    if (text === '') return;

    var list = document.getElementById('commentList');
    var newItem = document.createElement('div');
    newItem.className = 'comment-item';
    var now = new Date();
    var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    newItem.innerHTML = '<span class="name">你</span><span>' + text + '</span><span class="time">' + timeStr + '</span>';
    list.insertBefore(newItem, list.firstChild);

    input.value = '';

    while (list.children.length > 20) {
      list.removeChild(list.lastChild);
    }
  }

  document.getElementById('commentInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      addComment();
    }
  });

  // ===== 音乐控制 =====
  var music = document.getElementById('bg-music');
  var isPlaying = false;
  var musicBtn = document.querySelector('.music-btn');

  function toggleMusic() {
    if (isPlaying) {
      music.pause();
      isPlaying = false;
      musicBtn.textContent = '▶ 播放音乐';
    } else {
      music.play().catch(function() {});
      isPlaying = true;
      musicBtn.textContent = '⏸ 暂停音乐';
    }
  }

  music.addEventListener('ended', function() {
    isPlaying = false;
    musicBtn.textContent = '▶ 播放音乐';
  });
</script>

</body>
</html>
